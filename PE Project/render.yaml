services:
  - type: web
    name: civicfix-ai
    runtime: docker
    # torch + MiniLM + FAISS need >512 MB RAM, so the free plan will crash (OOM).
    plan: starter
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: gemini        # or groq / openai
      - key: GEMINI_API_KEY  # set the value in the Render dashboard
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
